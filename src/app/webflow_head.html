<style>

.services-slide{overflow-x: clip;}

.glow-on-hover {
    border: none;
    outline: none;
    cursor: pointer;
    position: relative;
    z-index: 0;
    border-radius: 10px;
}

.glow-on-hover:before {
    content: '';
    background: linear-gradient(45deg, #ff0000, #ff7300, #fa7f08, #A52A2A);
    position: absolute;
    top: -2px;
    left:-2px;
    background-size: 400%;
    z-index: -1;
    filter: blur(5px);
    width: calc(100% + 4px);
    height: calc(100% + 4px);
    animation: glowing 20s linear infinite;
    opacity: 0;
    transition: opacity .3s ease-in-out;
    border-radius: 10px;
}

.glow-on-hover:active {
    color: #000
}

.glow-on-hover:active:after {
    background: transparent;
}

.glow-on-hover:hover:before {
    opacity: 1;
}

.glow-on-hover:after {
    z-index: -1;
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: repeating-linear-gradient(181.68deg, #fa7f08, #1b1718);
    left: 0;
    top: 0;
    border-radius: 10px;
}

@keyframes glowing {
    0% { background-position: 0 0; }
    50% { background-position: 400% 0; }
    100% { background-position: 0 0; }
}
</style>
<style>

  background-image: none !important;

  box-shadow: 0 4px 15px rgba(250, 127, 8, 0.3) !important;
  transition: all 0.3s ease !important;
}
.button-2:hover, .glow-on-hover:hover {
  background-color: #e06c00 !important;
  transform: translateY(-2px) !important;
  box-shadow: 0 6px 20px rgba(250, 127, 8, 0.45) !important;
}
.glow-on-hover:before, .glow-on-hover:after {
  display: none !important;
}
</style>
